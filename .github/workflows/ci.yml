name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pester-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ejecutar tests Pester
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Resumen
        if: always()
        shell: pwsh
        run: |
          Write-Host "CI de PC Toolkit finalizado."
